services:
  - type: web
    name: pocket-cosmos
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
